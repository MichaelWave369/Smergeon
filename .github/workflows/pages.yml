name: Deploy Smergeon Repository Hospital

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy the *trusted* main branch only. PRs never deploy to public Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smergeon-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only released site
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload strictly static /web assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
